<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}构建机镜像层复用配对{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f5f7fa; color: #1f2933; }
    header { background: #1f4e79; color: #fff; padding: 18px 32px; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 960px; margin: 28px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 10px;
            padding: 22px 26px; margin-bottom: 22px; }
    h2 { margin-top: 0; font-size: 17px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #d3d8de; padding: 8px 10px; text-align: left; }
    th { background: #eef2f6; }
    .muted { color: #667; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
             font-size: 12px; font-weight: 600; }
    .b-run { background: #fff3cd; color: #8a6d3b; }
    .b-done { background: #d4edda; color: #155724; }
    .b-fail { background: #f8d7da; color: #721c24; }
    .b-part { background: #d1ecf1; color: #0c5460; }
    button, .btn { background: #1f4e79; color: #fff; border: 0; border-radius: 6px;
            padding: 9px 18px; font-size: 14px; cursor: pointer; text-decoration: none;
            display: inline-block; }
    button:disabled, .btn.disabled { background: #9bb3c9; cursor: not-allowed; }
    input[type=file] { margin: 8px 0 14px; display: block; }
    code { background: #eef2f6; padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
<header><h1>退役构建机镜像层复用配对</h1></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
